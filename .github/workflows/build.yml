name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # برای ساخت Release و آپلود APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # اگر مدل در ریپو نیست، نسخه‌ی رسمی MobileNet v1 کوانتیزه از TensorFlow دانلود می‌شود
      - name: Download model if missing
        run: |
          ASSETS=app/src/main/assets
          mkdir -p "$ASSETS"
          if [ ! -f "$ASSETS/model.tflite" ]; then
            curl -fsSL -o /tmp/model.zip \
              https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v1_1.0_224_quant_and_labels.zip
            mkdir -p /tmp/model && unzip -o -q /tmp/model.zip -d /tmp/model
            cp "$(find /tmp/model -name '*.tflite' | head -1)" "$ASSETS/model.tflite"
            cp "$(find /tmp/model -name '*.txt' | head -1)" "$ASSETS/labels.txt"
          fi
          ls -la "$ASSETS"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EdgeAIBenchmark.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EdgeAIBenchmark-apk
          path: EdgeAIBenchmark.apk

      # آخرین APK همیشه در Release با تگ «latest» در دسترس است (دانلود مستقیم از موبایل)
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest EdgeAIBenchmark.apk \
            --title "آخرین نسخه (${GITHUB_SHA::7})" \
            --notes "ساخته‌شده خودکار از commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
